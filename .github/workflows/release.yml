name: Release

# Cut a release by pushing a tag:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The version name comes from the tag and the version code from the run number, so every
# release is installable over the last one. Needs four repository secrets — see
# docs/RELEASING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, e.g. 0.2.0 (no leading v)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest ships an Android SDK but not necessarily the platform this
      # project compiles against, and AGP will not fetch it on its own.
      - name: Install the Android platform and build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NAME="${{ github.event.inputs.version }}"
          else
            NAME="${GITHUB_REF_NAME#v}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # Monotonic across every run, which is all Android asks of a version code.
          echo "code=$(( 1000 + GITHUB_RUN_NUMBER ))" >> "$GITHUB_OUTPUT"

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. See docs/RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble the signed release
        env:
          BL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BL_VERSION_NAME: ${{ steps.version.outputs.name }}
          BL_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          export BL_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew :app:testDebugUnitTest :app:assembleRelease
          mv app/build/outputs/apk/release/app-release.apk \
             "better-lyrics-${{ steps.version.outputs.name }}.apk"

      - name: Verify it really is signed
        run: |
          APK="better-lyrics-${{ steps.version.outputs.name }}.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"

      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Write the release notes
        run: |
          {
            printf '**Install:** download the APK below and open it. Android will ask you to allow installing from this source.\n\n'
            printf '**First run:** grant notification access when the app asks — that is how it sees what is playing. Everything else is optional; the welcome guide in the app explains which tokens add what.\n\n'
            printf 'Signed with the project release key; `arm64-v8a` and `x86_64`, minSdk 29.\n'
          } > release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="${{ steps.version.outputs.name }}"
          gh release create "v$NAME" "better-lyrics-$NAME.apk" \
            --title "v$NAME" \
            --notes-file release-notes.md
